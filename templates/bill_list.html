{% extends "base.html" %}
{% block content %}

<div class="mt-4"></div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>收支记录</h4>
    <div class="d-flex gap-2">
        <a href="/bill/add" class="btn btn-primary px-4">添加账单</a>
        <a href="/transfer" class="btn btn-success px-4">转账</a>
    </div>
</div>

<div class="alert alert-light rounded-lg mb-3">总条数：{{ bills|length }}</div>

<div class="card">
    <div class="table-responsive">
        <table class="table table-hover align-middle m-0">
            <tr>
                <th>日期时间</th>
                <th>类型</th>
                <th>金额</th>
                <th>分类</th>
                <th>二级分类</th>
                <th>账户</th>
                <th>操作</th>
            </tr>
            {% for b in bills %}
            <tr>
                <td>{{ b[2] }}</td>
                <td>{{ b[3] }}</td>
                <td>{{ b[4] }}</td>
                <td>{{ b[5] }}</td>
                <td>{{ b[6] }}</td>
                <td>{{ b[7] }}</td>
                <td>
                    <div class="action-btns">
                        <a href="/bill/edit/{{ b[0] }}" class="btn btn-sm btn-warning">编辑</a>
                        <a href="/bill/delete/{{ b[0] }}" class="btn btn-sm btn-danger" onclick="return confirm('确认删除？')">删除</a>
                    </div>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="7" class="text-center py-4 text-muted">暂无记录</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>

{% endblock %}
