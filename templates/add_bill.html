{% extends "base.html" %}
{% block content %}
<div class="mt-4"></div>

<div class="card">
    <h4 class="mb-4">添加账单</h4>
    <form method="post" action="/bill/save" class="row g-3">

        <!-- 时间 -->
        <div class="col-md-3">
            <label>日期时间（精确到秒）</label>
            <input type="datetime-local" name="date" class="form-control" step="1" required>
        </div>

        <!-- 收支类型 同款大下拉框 -->
        <div class="col-md-3">
            <label>收支类型</label>
            <div class="dropdown w-100">
                <button class="btn btn-outline-secondary w-100 text-start dropdown-toggle" type="button">
                    请选择
                </button>
                <ul class="dropdown-menu w-100">
                    <li><a class="dropdown-item" data-value="收入">收入</a></li>
                    <li><a class="dropdown-item" data-value="支出">支出</a></li>
                </ul>
                <input type="hidden" name="type" id="type" required>
            </div>
        </div>

        <!-- 金额 -->
        <div class="col-md-3">
            <label>金额</label>
            <input type="number" step="0.01" name="money" class="form-control" required>
        </div>

        <!-- 类别 同款大下拉框 -->
        <div class="col-md-3">
            <label>类别</label>
            <div class="dropdown w-100">
                <button class="btn btn-outline-secondary w-100 text-start dropdown-toggle" type="button">
                    请选择
                </button>
                <ul class="dropdown-menu w-100">
                    {% for k in cats.keys() %}
                    <li><a class="dropdown-item" data-value="{{ k }}">{{ k }}</a></li>
                    {% endfor %}
                </ul>
                <input type="hidden" name="category" id="category" required>
            </div>
        </div>

        <!-- 二级分类 -->
        <div class="col-md-3">
            <label>二级分类</label>
            <div class="dropdown w-100">
                <button class="btn btn-outline-secondary w-100 text-start dropdown-toggle" type="button">
                    请选择
                </button>
                <ul class="dropdown-menu w-100" id="subList">
                </ul>
                <input type="hidden" name="sub_category" id="sub_category" required>
            </div>
        </div>

        <!-- 账户 -->
        <div class="col-md-3">
            <label>账户</label>
            <div class="dropdown w-100">
                <button class="btn btn-outline-secondary w-100 text-start dropdown-toggle" type="button">
                    请选择
                </button>
                <ul class="dropdown-menu w-100">
                    {% for a in accounts %}
                    <li><a class="dropdown-item" data-value="{{ a }}">{{ a }}</a></li>
                    {% endfor %}
                </ul>
                <input type="hidden" name="account" id="account" required>
            </div>
        </div>

        <!-- 备注 -->
        <div class="col-md-12">
            <label>备注</label>
            <textarea name="remark" class="form-control" rows="3"></textarea>
        </div>

        <div class="col-md-12">
            <button class="btn btn-primary w-100">保存</button>
        </div>
    </form>
</div>

<script>
const cats = {{ cats|tojson }};

// 下拉框选择功能
document.querySelectorAll('.dropdown-item').forEach(item => {
    item.onclick = function () {
        const btn = this.closest('.dropdown').querySelector('button');
        const input = this.closest('.dropdown').querySelector('input[type=hidden]');
        btn.innerText = this.innerText;
        input.value = this.dataset.value;
    };
});

// 二级分类联动
const category = document.getElementById('category');
const subList = document.getElementById('subList');
const subInput = document.getElementById('sub_category');
const subBtn = subList.closest('.dropdown').querySelector('button');

function loadSubCategory() {
    subList.innerHTML = '';
    const catVal = category.value;
    if (catVal && cats[catVal]) {
        cats[catVal].forEach(item => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.className = 'dropdown-item';
            a.dataset.value = item;
            a.innerText = item;
            a.onclick = function () {
                subBtn.innerText = this.innerText;
                subInput.value = this.dataset.value;
            };
            li.appendChild(a);
            subList.appendChild(li);
        });
    }
}

category.addEventListener('change', loadSubCategory);
</script>

<style>
/* 鼠标悬浮自动展开下拉，宽度100% */
.dropdown:hover .dropdown-menu {
    display: block;
    margin-top: 0;
    width: 100% !important;
}
.dropdown-menu {
    max-height: 260px;
    overflow-y: auto;
}
</style>
{% endblock %}
