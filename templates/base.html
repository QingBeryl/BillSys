<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fa;
            min-height: 100vh;
            padding-top: 60px;
            padding-bottom: 20px;
        }
        .container {
            max-width: 100% !important;
            padding: 0 22px;
        }
        .card {
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 18px rgba(0,0,0,0.05);
            background: #fff;
            padding: 24px;
            margin-bottom: 20px;
        }
        .navbar {
            height: 60px;
            background: #1f2937 !important;
        }
        .form-control, .form-select {
            border-radius: 10px;
            height: 44px;
            border: 1px solid #e5e7eb;
        }
        .btn {
            border-radius: 10px;
            height: 44px;
            font-weight: 500;
        }
        .btn-sm {
            height: 36px;
        }
        /* 悬浮下拉框 */
        select:hover {
            border-color: #0d6efd;
        }
        /* 悬浮添加按钮 */
        .float-add {
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(13,110,253,0.4);
            cursor: pointer;
            z-index: 999;
            text-decoration: none;
        }
        .float-add:hover {
            transform: scale(1.08);
            transition: 0.2s;
            color: white;
        }
        /* 按钮组紧凑 */
        .action-btns {
            display: flex;
            gap: 6px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/index">账单管理系统</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/index">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/bill/list">收支记录</a></li>
                <li class="nav-item"><a class="nav-link" href="/query">查询记录</a></li>
                <li class="nav-item"><a class="nav-link" href="/excel">导入导出</a></li>
                {% if session.is_admin %}
                <li class="nav-item"><a class="nav-link" href="/user/manage">用户管理</a></li>
                {% endif %}
            </ul>
            <span class="text-white me-3">欢迎您，{{ session.username }}</span>
            <a class="btn btn-sm btn-danger" href="/logout">退出登录</a>
        </div>
    </div>
</nav>

<a href="/transfer" class="float-add">+</a>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
