{% extends "base.html" %}
{% block content %}

<div class="mt-4"></div>

<div class="card">
    <h4>用户管理</h4>
    <hr>

    <form method="post" action="/user/add" class="row g-3 mb-4">
        <div class="col-md-4">
            <input name="username" class="form-control" placeholder="用户名" required>
        </div>
        <div class="col-md-4">
            <input name="password" class="form-control" placeholder="密码" required>
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100">添加用户</button>
        </div>
    </form>

    <table class="table table-hover align-middle">
        {% for u in users %}
        <tr>
            <td width="200">用户名：<b>{{ u[1] }}</b></td>
            <td>
                <div id="edit_{{ u[0] }}" style="display:none;">
                    <form method="post" action="/user/update" class="d-flex gap-2">
                        <input type="hidden" name="id" value="{{ u[0] }}">
                        <input name="username" value="{{ u[1] }}" class="form-control w-25">
                        <input name="password" value="{{ u[2] }}" class="form-control w-25">
                        <button class="btn btn-sm btn-success">保存</button>
                        <button type="button" class="btn btn-sm btn-secondary" onclick="cancelEdit({{ u[0] }})">取消</button>
                    </form>
                </div>
                <div id="show_{{ u[0] }}">
                    密码已隐藏
                </div>
            </td>
            <td width="160">
                <div class="action-btns">
                    <button class="btn btn-sm btn-warning" onclick="showEdit({{ u[0] }})">修改</button>
                    <a href="/user/delete/{{ u[0] }}" class="btn btn-sm btn-danger" onclick="return confirm('确认删除？')">删除</a>
                </div>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

<script>
function showEdit(id){
    document.getElementById('edit_'+id).style.display = 'block';
    document.getElementById('show_'+id).style.display = 'none';
}
function cancelEdit(id){
    document.getElementById('edit_'+id).style.display = 'none';
    document.getElementById('show_'+id).style.display = 'block';
}
</script>
{% endblock %}
