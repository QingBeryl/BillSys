<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 460px; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.07); }
    </style>
</head>
<body>
<div class="login-card">
    <h2 class="text-center mb-4">账单管理系统</h2>
    {% with msg = get_flashed_messages() %}
        {% if msg %}
            {% for m in msg %}
                <div class="alert alert-danger">{{ m }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="post">
        <div class="mb-3">
            <label>用户名</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>密码</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">登录</button>
    </form>
</div>
</body>
</html>
