{% extends "base.html" %}
{% block content %}
<div class="mt-4"></div>

<div class="card">
    <h4 class="mb-4">编辑账单</h4>
    <form method="post" action="/bill/edit_save/{{ bill[0] }}" class="row g-3">
        <div class="col-md-3">
            <label>日期时间</label>
            <input type="datetime-local" name="date" class="form-control" value="{{ bill[2] }}" required>
        </div>
        <div class="col-md-3">
            <label>收支类型</label>
            <select name="type" class="form-control" required>
                <option {% if bill[3] == '收入' %}selected{% endif %}>收入</option>
                <option {% if bill[3] == '支出' %}selected{% endif %}>支出</option>
            </select>
        </div>
        <div class="col-md-3">
            <label>金额</label>
            <input type="number" step="0.01" name="money" class="form-control" value="{{ bill[4] }}" required>
        </div>
        <div class="col-md-3">
            <label>类别</label>
            <select name="category" id="cat" class="form-control" required>
                {% for k in cats.keys() %}
                <option {% if k == bill[5] %}selected{% endif %}>{{ k }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label>二级分类</label>
            <select name="sub_category" class="form-control" required>
                <option selected>{{ bill[6] }}</option>
            </select>
        </div>
        <div class="col-md-3">
            <label>账户</label>
            <select name="account" class="form-control" required>
                {% for a in accounts %}
                <option {% if a == bill[7] %}selected{% endif %}>{{ a }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-12">
            <label>备注</label>
            <textarea name="remark" class="form-control" rows="3">{{ bill[8] if bill[8] else '' }}</textarea>
        </div>
        <div class="col-md-12">
            <button class="btn btn-warning w-100">保存修改</button>
        </div>
    </form>
</div>

<script>
const cats = {{ cats|tojson }};
const cat = document.getElementById('cat');
const sub = document.querySelector('[name=sub_category]');
function loadSub(){
    sub.innerHTML = '';
    cats[cat.value].forEach(item => {
        const opt = document.createElement('option');
        opt.innerText = item;
        sub.appendChild(opt);
    });
}
cat.addEventListener('change', loadSub);
loadSub();
</script>
{% endblock %}
