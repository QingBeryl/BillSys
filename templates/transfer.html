{% extends "base.html" %}
{% block content %}
<h4>转账</h4>
<form method="post" action="/transfer/save">
    <div class="mb-2"><label>日期</label><input type="datetime-local" name="date" class="form-control" required></div>
    <div class="mb-2">
        <label>转出账户</label>
        <select name="out_account" class="form-control" required>
            {% for a in accounts %}<option>{{ a }}</option>{% endfor %}
        </select>
    </div>
    <div class="mb-2">
        <label>转入账户</label>
        <select name="in_account" class="form-control" required>
            {% for a in accounts %}<option>{{ a }}</option>{% endfor %}
        </select>
    </div>
    <div class="mb-2"><label>金额</label><input type="number" step="0.01" name="money" class="form-control" required></div>
    <div class="mb-2"><label>备注</label><textarea name="remark" class="form-control"></textarea></div>
    <button class="btn btn-primary">确认转账</button>
</form>
{% endblock %}
